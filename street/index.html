<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundry Town street view</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: #fff7e6; background: #17343b; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: var(--map-height, clamp(350px, 56.25vw, 720px)); background: #315860; }
    canvas:focus-visible, button:focus-visible { outline: 3px solid #f8cb76; outline-offset: -3px; }
    .status { display: flex; flex-wrap: wrap; column-gap: 1rem; padding: 4px 8px; line-height: 1.4; }
    #hint { font-weight: 700; }
    #route { color: #bde7ff; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 8px; }
    .controls p { margin: 0; }
    /* Actions: dark buttons with their key drawn as a small keyboard key, like the buttons inside buildings */
    button { display: inline-flex; align-items: center; gap: 8px; background: #1b1f27; color: #fafafa;
             border: 1px solid #4b505a; border-radius: 8px; min-height: 44px; min-width: 44px; padding: 4px 12px;
             touch-action: none; font: inherit; cursor: pointer; }
    button:hover { border-color: #fafafa; }
    button:active { background: #2a303b; }
    kbd, .pad button { background: #f4f1ea; color: #2b2f36; border: 0; border-radius: 5px; font: 700 12px system-ui, sans-serif;
                       box-shadow: 0 2px 0 #a9a49a; }
    kbd { display: inline-block; min-width: 22px; padding: 3px 6px; text-align: center; }
    /* The movement pad: each button is itself a key */
    .pad { display: flex; gap: 6px; padding-bottom: 4px; }
    .pad button { justify-content: center; width: 44px; min-height: 40px; padding: 0; font-size: 18px; border-radius: 7px;
                  box-shadow: 0 4px 0 #a9a49a; }
    .pad button:hover { background: #fffdf7; }
    .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a9a49a; background: #e8e3d8; }
  </style>
</head>
<body>
  <canvas id="map" tabindex="0" aria-label="Foundry Town map. Move with WASD or arrows. Press E to interact."></canvas>
  <div class="status">
    <div id="hint"></div>
    <div id="route" role="status"></div>
  </div>
  <div class="controls">
    <div class="pad" aria-label="Movement controls">
      <button data-direction="left" aria-label="Walk left">←</button>
      <button data-direction="up" aria-label="Walk up">↑</button>
      <button data-direction="down" aria-label="Walk down">↓</button>
      <button data-direction="right" aria-label="Walk right">→</button>
    </div>
    <button data-action="interact"><span>Interact</span><kbd>E</kbd></button>
    <button data-action="bulk" hidden><span>Bulk buy</span><kbd>Q</kbd></button>
    <button data-action="vehicle" hidden><span>Leave vehicle</span><kbd>V</kbd></button>
    <p>Focus the map to walk with WASD or arrows.</p>
  </div>
  <script src="street.js"></script>
</body>
</html>
